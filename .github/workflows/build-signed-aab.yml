name: Build Kids Police Signed AAB

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-signed-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing RELEASE_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing RELEASE_STORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD repository secret" && exit 1)

      - name: Restore private upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-upload.jks
          test -s app/release-upload.jks
          keytool -list -keystore app/release-upload.jks -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" -alias upload

      - name: Build signed release AAB
        env:
          RELEASE_KEYSTORE_PATH: app/release-upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: upload
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: KidsPolice-signed-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f app/release-upload.jks
